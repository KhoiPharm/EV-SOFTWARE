name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      EV_ENVIRONMENT: test
      EV_LOG_LEVEL: WARNING
      EV_PRESENTATION_TIMEZONE: Australia/Sydney
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Generate Ruff formatting patch
        run: |
          ruff format .
          git diff --binary > ruff-format.patch
      - name: Upload Ruff formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: ruff-format-patch
          path: ruff-format.patch
          if-no-files-found: error
      - name: Mypy
        run: mypy src tests
      - name: Pytest
        run: pytest
      - name: Verify formatting is committed
        run: git diff --exit-code

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ev_scanner
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ev_scanner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ev_scanner -d ev_scanner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EV_ENVIRONMENT: test
      EV_LOG_LEVEL: WARNING
      EV_DATABASE_URL: postgresql+psycopg://ev_scanner:ci_only_password@127.0.0.1:5432/ev_scanner_test
      EV_PRESENTATION_TIMEZONE: Australia/Sydney
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Migration smoke test
        run: alembic upgrade head
