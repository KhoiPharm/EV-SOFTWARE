name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      EV_ENVIRONMENT: test
      EV_LOG_LEVEL: WARNING
      EV_PRESENTATION_TIMEZONE: Australia/Sydney
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src tests
      - name: Pytest
        run: pytest

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ev_scanner
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ev_scanner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ev_scanner -d ev_scanner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EV_ENVIRONMENT: test
      EV_LOG_LEVEL: WARNING
      EV_DATABASE_URL: postgresql+psycopg://ev_scanner:ci_only_password@127.0.0.1:5432/ev_scanner_test
      EV_PRESENTATION_TIMEZONE: Australia/Sydney
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Migration smoke test
        run: alembic upgrade head

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure local environment
        run: cp .env.example .env
      - name: Start local stack
        run: docker compose up --build --detach
      - name: Wait for API readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Stop local stack
        if: always()
        run: docker compose down --volumes
